name: generate github-contribution-grid-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Snake
        uses: rahulrkr03/github-contribution-grid-snake@main
        with:
          github_user_name: Lokesh777
          file_path: output/github-contribution-grid-snake.svg
      - name: Push Snake
        run: |
          git config user_agent "github-actions[bot]"
          git config user_email "github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          git commit -m "update: contribution snake" || exit 0
          git push
